{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="container my-5">
    <h2 class="text-center mb-4 display-4 fw-bold text-primary">Carrito de Compras</h2>
    <div class="card shadow">
        <div class="card-body">
            <div id="carrito-vacio" class="text-center py-4">
                <i class="fas fa-shopping-cart fa-4x text-muted mb-3"></i>
                <h4 class="text-muted">Tu carrito está vacío</h4>
                <p class="text-muted">Agrega productos para comenzar</p>
            </div>
            <div id="items-carrito" class="mb-3"></div>
            <!-- Selector de tipo de entrega -->
            <div class="mb-3">
                <label for="tipo-entrega" class="form-label">Tipo de entrega:</label>
                <select id="tipo-entrega" class="form-select">
                    <option value="retiro">Retiro en tienda</option>
                    <option value="despacho">Despacho a domicilio</option>
                </select>
            </div>
            <!-- Selector de método de pago -->
            <div class="mb-3">
                <label for="metodo-pago" class="form-label">Método de pago:</label>
                <select id="metodo-pago" class="form-select">
                    <option value="stripe">Tarjeta (débito/crédito)</option>
                    <option value="transferencia">Transferencia bancaria</option>
                </select>
            </div>
            <!-- Selector de moneda -->
            <div class="mb-3">
                <label for="selector-moneda" class="form-label">Moneda:</label>
                <select id="selector-moneda" class="form-select">
                    <option value="clp">Pesos Chilenos (CLP)</option>
                    <option value="usd">Dólares (USD)</option>
                </select>
            </div>
            <!-- Botón de pago Stripe (solo JS, sin form clásico) -->
            <button id="btn-pagar-stripe" class="btn btn-primary w-100 mb-3">Pagar con Stripe</button>
            <div id="total-container" class="d-flex justify-content-between align-items-center p-3 bg-light rounded">
                <div>
                    <h4 class="mb-0">
                        Total: <span id="total-carrito" class="text-primary precio" data-precio="0">$0</span>
                    </h4>
                    <small class="text-muted">
                        <i class="fas fa-box me-1"></i>
                        <span id="cantidad-productos-carrito">0</span> producto(s) en el carrito
                    </small>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
